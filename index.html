<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winners Ecosystem — AI-Powered Revenue Analytics</title>
    <meta name="description" content="Real-time revenue analytics, Claude-powered insights, and automated reporting for winning teams." />
    <meta name="theme-color" content="#F5C842" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Prevent flash of white before React loads */
      body { background: #080B10; margin: 0; }
    </style>
    <script>
  (function() {
    try {
      var t = localStorage.getItem("winners_theme") || "dark";
      var r = document.documentElement;
      r.classList.add(t);
      if (t === "light") {
        r.style.setProperty("--bg", "#F4F6FA");
        r.style.setProperty("--surface", "#FFFFFF");
        r.style.setProperty("--surface2", "#EDF0F7");
        r.style.setProperty("--border", "#D8DEE9");
        r.style.setProperty("--text", "#0F1923");
        r.style.setProperty("--text-dim", "#6B7A99");
        r.style.setProperty("--gold", "#C9960A");
      }
    } catch(e) {}
  })();
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
